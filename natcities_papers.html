<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Cities 论文数据库 · 173篇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;--text3:#57606a;
  --accent:#58a6ff;--accent2:#1f6feb;--green:#3fb950;--amber:#d29922;
  --red:#f85149;--purple:#bc8cff;
}
html{background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* HEADER */
.header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:24px 20px 20px;position:sticky;top:0;z-index:100;
  backdrop-filter:blur(10px);
}
.header-inner{max-width:1200px;margin:0 auto;}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.journal-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:#1c2128;border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;
}
.journal-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.journal-name{font-size:13px;font-weight:600;color:var(--text);}
.journal-sub{font-size:11px;color:var(--text2);}
.header-stats{display:flex;gap:16px;flex-wrap:wrap;}
.stat-chip{
  font-size:12px;font-weight:500;color:var(--text2);
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;
}
.stat-chip span{color:var(--accent);font-weight:700;}

/* SEARCH + FILTER BAR */
.toolbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 20px;
}
.toolbar-inner{max-width:1200px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-wrap{flex:1;min-width:200px;position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.4;}
#searchInput{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:8px 12px 8px 34px;
  font-size:13px;color:var(--text);outline:none;
  transition:border-color 0.2s;
}
#searchInput:focus{border-color:var(--accent2);}
#searchInput::placeholder{color:var(--text3);}
select{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text2);
  outline:none;cursor:pointer;
}
select:focus{border-color:var(--accent2);}
.filter-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tag-btn{
  font-size:11px;font-weight:500;
  padding:4px 10px;border-radius:20px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface2);color:var(--text2);
  transition:all 0.15s;white-space:nowrap;
}
.tag-btn:hover,.tag-btn.active{
  background:var(--accent2);border-color:var(--accent);color:var(--text);
}
.result-count{font-size:12px;color:var(--text3);margin-left:auto;white-space:nowrap;}

/* MAIN LAYOUT */
.main{max-width:1200px;margin:0 auto;padding:20px;display:flex;gap:20px;}
.sidebar{width:220px;flex-shrink:0;}
.content{flex:1;min-width:0;}

/* SIDEBAR CHARTS */
.sidebar-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:16px;margin-bottom:16px;
}
.sidebar-card h3{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;}
.bar-item{margin-bottom:8px;}
.bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px;}
.bar-track{background:var(--surface2);border-radius:2px;height:4px;overflow:hidden;}
.bar-fill{background:var(--accent);border-radius:2px;height:100%;transition:width 0.4s;}

/* PAPER CARD */
.paper-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:18px;margin-bottom:12px;
  transition:border-color 0.15s,transform 0.1s;cursor:default;
}
.paper-card:hover{border-color:var(--accent2);transform:translateY(-1px);}
.paper-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.paper-meta-left{flex:1;min-width:0;}
.paper-type-badge{
  display:inline-block;font-size:10px;font-weight:600;
  padding:2px 7px;border-radius:3px;margin-bottom:6px;letter-spacing:0.05em;
}
.type-article{background:#1c2d1e;color:var(--green);border:1px solid #2ea04326;}
.type-brief{background:#271c11;color:var(--amber);border:1px solid #d2992226;}
.paper-title{
  font-size:14px;font-weight:600;color:var(--text);line-height:1.45;
  margin-bottom:6px;
}
.paper-title a{color:inherit;text-decoration:none;}
.paper-title a:hover{color:var(--accent);}
.paper-date{font-size:11px;color:var(--text3);}
.paper-authors{font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.4;}
.paper-abstract{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
.paper-abstract.collapsed{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.paper-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.paper-tag{
  font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;
  background:var(--surface2);color:var(--text2);border:1px solid var(--border);
}
.paper-doi{font-size:10px;color:var(--text3);margin-left:auto;}
.expand-btn{
  font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;
  padding:0;text-decoration:underline;white-space:nowrap;
}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text2);
}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:0.4;}

/* RESPONSIVE */
@media(max-width:768px){
  .main{flex-direction:column;padding:12px;}
  .sidebar{width:100%;}
  .header-stats{gap:8px;}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

les/s44284-025-00302-1", "tags": ["air quality", "green & ecology", "climate & heat"]}, {"title": "", "authors": "Baojie Li, Hong Liao, Ke Li, Jintai Lin, Cheng Gong, Huan Liu, Yan Li, Lei Chen, Yang Yang, Xipeng Jin, Yongqi Zhao, Teng Wang, Jianbing Jin, Ruijun Dang, Daniel J. Jacob", "abstract": "Urban e-commerce growth has driven unprecedented expansion in express delivery services, yet their cross-regional environmental and health consequences remain poorly understood. Here we present a novel spatially explicit assessment of emissions and their environmental burden in China’s express delivery sector by integrating large-scale shipping records, geospatial modeling and atmospheric chemical...", "doi": "10.1038/s44284-025-00300-3", "year": "2025", "date": "2025-08-15", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00300-3", "tags": ["air quality", "transport", "health"]}, {"title": "", "authors": "Chengxiu Li, Le Yu, Robert Ndugwa, Adrian J. Bailey, Xiaoling Zhang, Francis Oloo, Ellasy Gulule Chimimba, Xiangzheng Deng, Jim Wright", "abstract": "Slums house nearly one-quarter of the global urban population, yet their spatial and socioeconomic dynamics remain poorly understood, hindering progress toward the United Nations’ commitment to ‘leave no one behind’. Here, focusing on sub-Saharan Africa, we integrate geospatial data with household surveys to map slum prevalence and asset-based wealth inequalities across 32 countries. We identify t...", "doi": "10.1038/s44284-025-00276-0", "year": "2025", "date": "2025-08-08", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00276-0", "tags": ["inequality", "economy"]}, {"title": "", "authors": "Xin Sun, Jake M. Robinson, Manuel Delgado-Baquerizo, Anton Potapov, Haifeng Yao, Biao Zhu, Alexei V. Tiunov, Linxiu Zhang, Faith Ka Shun Chan, Scott X. Chang, Martin F. Breed, Nico Eisenhauer, Stefan Scheu, Zhipeng Li, Yong-Guan Zhu", "abstract": "Soils in urban greenspaces often support hi www.nature.com/articles/s44284-025-00290-2", "tags": ["climate & heat"]}, {"title": "", "authors": "Yingjie Li, Yuanyuan Mao, Lisa Mandle, Anders Rydström, Roy P. Remme, Xin Lan, Tong Wu, Chao Song, Yougeng Lu, Kari C. Nadeau, Andreas Meyer-Lindenberg, Gretchen C. Daily, Anne D. Guerry", "abstract": "Mental disorders are more prevalent in cities, yet the global impact of urban nature on mental health remains insufficiently understood. Here we address this gap by systematically reviewing 449 peer-reviewed studies and conducting a meta-analysis of 78 field-based experiments to quantify the effects of various urban nature types on 12 mental health outcomes. Our meta-analysis demonstrates that exp...", "doi": "10.1038/s44284-025-00286-y", "year": "2025", "date": "2025-07-30", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00286-y", "tags": ["green & ecology", "transport", "health"]}, {"title": "", "authors": "Barrak Alahmad, Shih-Chun Candice Lung, Andrew Makar, Yazan Alwadi, Chun-Hsiang Chiu, Shu-Chuan Hu, Ling-Jyh Chen, Hsin Hung Chen, C. Y. Chen", "abstract": "Rapid urbanization has intensified the demand for new buildings, exposing outdoor construction workers to heightened physical strain and reduced productivity, particularly in hot-humid urban environments. Here we quantify heat stress and associated productivity losses among 101 workers across 10 construction sites in Taipei and New Taipei City. We find that in labor-intensive sectors like construc...", "doi": "10.1038/s44284-025-00283-1", "year": "2025", "date": "2025-07-29", "type": "Brief Communication", "url": "https://www.nature.com/articles/s44284-025-00283-1", "tags": ["climate & heat", "economy"]}, {"title": "", "authors": "Bin Jiang, Jiali Li, Peng Gong, Chris Webster, Gunter Schumann, Xueming Liu, Pongsakorn Suppakittpaisarn", "abstract": "Exposure to green spaces is a boon to urbanites. Over the last four decades, an increasing number of researchers have shown interest in exploring the relationship between the dose of greenness and mental health response. Early studies suggested a linear dose–response relationship, making it challenging to identify the most beneficial doses of greenness. However, findings from a rapidly growing bod...", "doi": "10.1038/s44284-025-00285-z", "year": "2025", "date": "2025-07-25", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00285-z", "tags": ["green & ecology", "health"]}, {"title": "", "authors": "Siddhesh Zadey, Leah E. Roberts, Brady Bushover, Ariana N. Gobaud, Christina A. Mehranbod, Carolyn S. Fish, Evan L. Eschliman, Xiang Gao, Dana E. Goin, Christopher N. Morrison", "abstract": "New York City has implemented a suite of interventions to reduce road traffic crashes, including leading pedestrian intervals (LPIs), which give pedestrians a head start over the turning vehicular traffic. This study assessed the effectiveness of LPIs in reducing pedestrian injuries across 6,003 intersections (2,869 with LPI treatment) from 2013 to 2018. They conclude that LPIs are an effective in...", "doi": "10.1038/s44284-025-00267-1", "year": "2025", "date": "2025-07-18", "type": "Brief Communication", "url": "https://www.nature.com/articles/s44284-025-00267-1", "tags": ["transport"]}, {"title": "", "authors": "Gukhwa Jang, Saehoon Kim, Jae Seung Lee", "abstract": "As the COVID-19 pandemic exposed and amplified structural vulnerabilities in cities, understanding how urban shrinkage exacerbates public health risks has become increasingly urgent. This study examines the relationship between urban shrinkage and excess mortality in 1,142 US counties during the COVID-19 pandemic (March 2020–February 2023). Using Kruskal–Wallis tests and mixed-effects models, we a...", "doi": "10.1038/s44284-025-00278-y", "year": "2025", "date": "2025-07-18", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00278-y", "tags": ["health", "inequality", "disaster"]}, {"title": "", "authors": "Mai Shi, Xi Lu, Michael T. Craig", "abstract": "Rooftop solar photovoltaics (RPV) are vital for sustainably powering cities. However, most existing studies focus on RPV’s technical or economic potential often overlook real-world electricity consumption and regulatory constraints that shape actual deployment. Here we assess the deployable potential of RPV across 367 Chinese cities by incorporating variations in building types, regional character...", "doi": "10.1038/s44284-025-00270-6", "year": "2025", "date": "2025-07-14", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00270-6", "tags": ["planning", "economy", "energy"]}, {"title": "", "authors": "Zihua Chen, Xiaowei Li, Bingzhi Liu, Shaohua Wang, Xiao Li, Jiaxin Li, Xiaohui Yang, Zhenbo Wang", "abstract": "Public transport (PT) accessibility is crucial to inclusive, sustainable urban development, as codified in United Nations Sustainable Development Goal (SDG) 11. Growth in PT accessibility can mask wide variation near and within even major cities. Contrary to the 2023 SDG report’s claim of over 80% convenient PT access in major Chinese cities, we find that only two cities’ villages meet the benchma...", "doi": "10.1038/s44284-025-00277-z", "year": "2025", "date": "2025-07-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00277-z", "tags": ["transport", "inequality", "planning"]}, {"title": "", "authors": "Lu Zhong, Lei Dong, Qi R. Wang, Chaoming Song, Jianxi Gao", "abstract": "Human mobility is a fundamental process underpinning socioeconomic life and urban structure. Classic theories, such as egocentric activity spaces and central place theory, provide crucial insights into specific facets of movement, including home-centricity and hierarchical spatial organization. However, identifying universal characteristics or an underlying principle that quantitatively links thes...", "doi": "10.1038/s44284-025-00268-0", "year": "2025", "date": "2025-07-09", "type": "Brief Communication", "url": "https://www.nature.com/articles/s44284-025-00268-0", "tags": ["health", "inequality", "planning"]}, {"title": "", "authors": "Dan Li, Laixiang Sun, Kuishuang Feng, Ning Zhang, Yang Yu, Dandan Zhao, Yuyu Zhou", "abstract": "Rapid urbanization is leading to the expansion of human settlements in flood-prone areas, and the impact is not uniform across different communities. Few studies have comprehensively investigated the flood exposure faced by vulnerable communities in the Global South, where pervasive slums present a major challenge to inclusive urban planning and flood management. Here, combining advanced machine l...", "doi": "10.1038/s44284-025-00273-3", "year": "2025", "date": "2025-07-04", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00273-3", "tags": ["climate & heat", "inequality", "planning"]}, {"title": "", "authors": "Nima Dahir, Hao Sheng, Keniel Yao, Sharad Goel, Jackelyn Hwang", "abstract": "Surveillance cameras are a prevalent form of monitoring in modern cities, with their placement reflecting neighborhood dynamics and social control. Here, using computer vision and human verification on Google Street View images across ten densely populated US cities, we assess how surveillance camera presence varies by neighborhood racial composition. Contrary to theories predicting high surveilla...", "doi": "10.1038/s44284-025-00274-2", "year": "2025", "date": "2025-07-02", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00274-2", "tags": ["green & ecology", "transport", "inequality"]}, {"title": "", "authors": "Simon Montfort, Max Callaghan, Felix Creutzig, William F. Lamb, Chenxi Lu, Tim Repke, Ke Ge, Jan Minx", "abstract": "Taking stock of climate change evidence is essential to helping cities address climate change. However, such efforts face challenges in appraising the growing scholarship in this fast-moving area. Here we use supervised and unsupervised machine learning to identify and classify over 53, g of the source and scale of artificial light emissions is still in the dark, hampering urban environmental protection efforts. In 2021, our citizen scientists used the Nachtlichter app to count and classify 234,044 light sources across a 22-km2 area, primarily in Germany. We show...", "doi": "10.1038/s44284-025-00239-5", "year": "2025", "date": "2025-06-16", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00239-5", "tags": ["air quality", "green & ecology", "transport"]}, {"title": "", "authors": "Lvlv Wang, Lin Meng, Andrew D. Richardson, Franz Hölker, Huidong Li, Jiafu Mao, Travis Longcore, Jun Xia, Dunxian She", "abstract": "Plant growing seasons are largely regulated by light and temperature. Cities are increasingly hot (higher air temperature), from the urban heat island effect, and bright (artificial light at night, ALAN). However, the relative effect of heat and light on the timing of plant growth events, called phenology, is unclear, limiting our understanding under climate change and urbanization. Here we used m...", "doi": "10.1038/s44284-025-00258-2", "year": "2025", "date": "2025-06-16", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00258-2", "tags": ["green & ecology", "climate & heat", "economy"]}, {"title": "", "authors": "Enjia Zhang, Jingxuan Hou, Ying Long", "abstract": "The digital era has reshaped urban commercial spaces, driving the emergence of less-visible shops in non-ground-floor and non-street-facing areas. To deepen the investigation of this transformation, this study analyzes the spatial evolution of commercial establishments across 287 Chinese cities from 2015 to 2023, using data from Dazhong-Dianping—a leading public review and rating platform for comm...", "doi": "10.1038/s44284-025-00254-6", "year": "2025", "date": "2025-06-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-025-00254-6", "tags": ["green & ecology", "transport", "planning"]}, {"title": "", "authors": "C 3", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00140-7", "tags": ["green & ecology", "planning", "economy"]}, {"title": "", "authors": "Amelia Thorpe, Marilyn Johnson, Courtney Hercus, Thomas Rudge, Soufiane Boufous, Derek Chong", "abstract": "On-demand delivery has changed the way cities move. Accelerated by the COVID-19 pandemic, bicycles are the leading mode meeting growing consumer demand, particularly for food. In Australia, this has generated considerable attention, but the voice of riders is missing. Using grounded theory to reveal rider perspectives, we combined interviews (n = 52), a naturalistic study (104 hours) and roadside ...", "doi": "10.1038/s44284-024-00145-2", "year": "2024", "date": "2024-10-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00145-2", "tags": ["green & ecology", "transport", "planning"]}, {"title": "", "authors": "Ansar Khan, Prashant Anand, Samira Garshasbi, Rupali Khatun, Samiran Khorat, Rafiq Hamdi, Dev Niyogi, Mattheos Santamouris", "abstract": "The widespread adoption of rooftop photovoltaic solar panels in urban environments presents a promising renewable energy solution but may also have unintended consequences on urban temperatures. This is primarily due to their lower albedo, which leads to increased heat absorption and enhanced thermal convection between the panels and the underlying roof surfaces. Here we show that, in Kolkata, cit...", "doi": "10.1038/s44284-024-00137-2", "year": "2024", "date": "2024-10-07", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00137-2", "tags": ["climate & heat", "planning", "energy"]}, {"title": "", "authors": "Charles H. Simpson, Oscar Brousse, Tim Taylor, James Grellier, Jonathon Taylor, Lora E. Fleming, Mike Davies, Clare Heaviside", "abstract": "Population exposure to high temperatures poses health risks and increases mortality. ‘Cool roofs’ (high-albedo roofs) and rooftop photovoltaics (RPV) may reduce temperatures in urban areas. Here, using advanced urban climate modeling, we model impacts of these measures on air temperature and heat-related mortality in London during the record-breaking hot summer of 2018. We estimate changes in mean...", "doi": "10.1038/s44284-024-00138-1", "year": "2024", "date": "2024-10-01", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00138-1", "tags": ["climate & heat", "health", "disaster"]}, {"title": "", "authors": "Matteo Bruno, Hygor Piaget Monteiro Melo, Bruno Campanelli, Vittorio Loreto", "abstract": "Proximity-based cities have attracted much attention in recent years. The ‘15-minute city’, in particular, heralded a new vision for cities where essential services must be easily accessible. Despite its undoubted merit in stimulating discussion on new organization of cities, the 15-minute city cannot be applicable everywhere, and its very definition raises a few concerns. Here we tackle the feasi...", "doi": "10.1038/s44284-024-00119-4", "year": "2024", "date": "2024-09-16", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00119-4", "tags": ["inequality", "economy"]}, {"title": "", "authors": "Rui Yang, Chao Xu, Haoran Zhang, Zhen Wang, Prajal Pradhan, Xihong Lian, Limin Jiao, Xuemei Bai, Shenghui Cui, Yuanchao Hu, Yong-Guan Zhu", "abstract": "Urban rooftop agriculture (RA) and photovoltaic power production (RPV) offer sustainable solutions for the food–energy nexus in cities but compete for limited rooftop space. Here we explore the potential benefits (productivity, economic and environmental) and allocation strategy of RA and RPV across 13 million buildings in 124 Chinese cities, considering urban characteristics and regional producti...", "doi": "10.1038/s44284-024-00127-4", "year": "2024", "date": "2024-09-16", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00127-4", "tags": ["air quality", "green & ecology", "health"]}, {"title": "", "authors": "Claudia V. Diezmartínez, Benjamin K. Sovacool, Anne G. Short Gianotti", "abstract": "Cities are moving toward the implementation of more just urban climate actions, but the politics and processes of operationalizing climate justice in practice remain understudied. Here we examine the implementation of climate justice through Boston’s Building Emissions Reduction and Disclosure Ordinance (BERDO), a landmark Building Performance Standard that reflects a transformative shift towards ...", "doi": "10.1038/s44284-024-00121-w", "year": "2024", "date": "2024-09-13", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00121-w", "tags": ["air quality", "climate & heat", "inequality"]}, {"title": "", "authors": "Andrew J. Fairbairn, Sebastian T. Meyer, Maximilian Mühlbauer, Kirsten Jung, Beate Apfelbeck, Katherine Berthon, Andrea Frank, Lea Guthmann, Jana Jokisch, Kristel Kerler, Nina Müller, Christina Obster, Michaela Unterbichler, Johanna Webersberger, Juliane Matejka, Paul Depner, Wolfgang W. Weisser", "abstract": "Cities are designed primarily for the benefit of humans but also provide habitat for other species. However, understanding how different components of urban vegetation and other features of urban spaces enable different species or species groups to live in the city remains limited. Here we show that, for the City of Munich, designed features of public urban squares strongly determine the occurrenc...", "doi": "10.1038/s44284-024-00126-5", "year": "2024", "date": "2024-09-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00126-5", "tags": ["green & ecology", "transport", "planning"]}, {"title": "", "authors": "Luyao Wang, Albert Saiz, Weipeng Li", "abstract": "Physical geography has long been identified as critical for urban development, land use and environmental outcomes in cities worldwide. However, the literature has yet to provide comprehensive, quantitative analyses of the global extent and impact of urban geographic barriers. Here we introduce three novel indexes: the share of natural barriers, nonconvexity (a measure of natural fragmentation) an...", "doi": "10.1038/s44284-024-00118-5", "year": "2024", "date": "2024-09-04", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00118-5", "tags": ["green & ecology", "transport", "health"]}, {"title": "", "authors": "Shengbiao Wu, Bin Chen, Jiafu An, Chen Lin, Peng Gong", "abstract": "Sunlight exposure in urban areas is essential for human health, yet its reduction due to cloud cover and complex 3D urban architecture is often overlooked. Here we introduce a framework that combines natural day length variations, cloud cover and 3D urban structures to assess sunlight duration in cities. Applying this framework to 1,353 US cities, we found a significant decrease of 2,896 h (121 da...", "doi": "10.1038/s44284-024-00120-x", "year": "2024", "date": "2024-09-02", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00120-x", "tags": ["climate & heat", "health", "planning"]}, {"title": "", "authors": "Chenxi Lu, Yingjian Huang, Ying Yu, Jiawei Hu, Huibin Mo, Yun Li, Da Huo, Xuanren Song, Xiaoting Huang, Yun Sun, Kai Liu, Shaohui Zhang, Karyn Morrissey, Jinpyo Hong, Zhu Deng, Zhuanjia Du, Felix Creutzig, Zhu Liu", "abstract": "Post-pandemic green recovery is pivotal in achieving global sustainable development goals by simultaneously revitalizing economies and reducing greenhouse gas emissions, air pollution and improving public welfare. However, subnational and city-level understanding of green recovery, its efficacy and its alignment with public health is poorly understood. Here we focus on post-COVID-19 low-carbon rec...", "doi": "10.1038/s44284-024-00115-8", "year": "2024", "date": "2024-08-28", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00115-8", "tags": ["air quality", "green & ecology", "transport"]}, {"title": "", "authors": "Abdulaziz I. Almulhim, Ayyoob Sharifi, Yusuf A. Aina, Shakil Ahmad, act": "Coastal cities are at the frontlines of climate change impacts, resulting in an urgent need for substantial adaptation. To understand whether, and to what extent, cities are on track to prepare for climate risks, this paper systematically assesses the academic literature to evaluate evidence on climate change adaptation in 199 coastal cities worldwide. Results show that adaptation in coastal citie...", "doi": "10.1038/s44284-024-00106-9", "year": "2024", "date": "2024-08-26", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00106-9", "tags": ["green & ecology", "climate & heat", "inequality"]}, {"title": "", "authors": "Fernando Malinowski, Carolina Ziebold, Cristiano Noto, Daniel Cavalcante, Síntia Belangero, Rodrigo Bressan, Ary Gadelha", "abstract": "The impact of social exclusion on psychosis is poorly understood. This study explores how slum living affects some clinical markers of patients in the first episode of psychosis. We hypothesized that living in a slum would lead to a longer duration of untreated psychosis and greater initial psychosis severity, as measured by the positive and negative syndrome scale. To test this hypothesis, we stu...", "doi": "10.1038/s44284-024-00109-6", "year": "2024", "date": "2024-08-16", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00109-6", "tags": ["transport", "inequality"]}, {"title": "", "authors": "Rodrigo Costa, Edward Bolte, Colleen Sharp, Corinne Bowers", "abstract": "Presidential major disaster declarations (PDs) are a key factor in determining the availability of federal grants and low-interest loans to support housing recovery in the United States. However, PDs are only issued after large disasters. After a disaster that does not trigger a PD, uninsured, lower-income households may be forced into debt to cover home repair costs. In the long term, paying off ...", "doi": "10.1038/s44284-024-00107-8", "year": "2024", "date": "2024-08-14", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00107-8", "tags": ["climate & heat", "inequality", "disaster"]}, {"title": "", "authors": "Julie Gravier, Marc Barthelemy", "abstract": "Contemporary literature on the dynamics of economic activities in growing cities has mainly focused on time frames of a few years or decades. Using a new geohistorical database constructed from historical directories with about 1 million entries, we present a comprehensive analysis of the dynamics of activities in a major city, Paris, over almost a century (1829–1907). Our analysis suggests that a...", "doi": "10.1038/s44284-024-00108-7", "year": "2024", "date": "2024-08-09", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00108-7", "tags": ["health", "economy"]}, {"title": "", "authors": "Shuzhe Huang, Siqi Wang, Yuan Gan, Chao Wang, Daniel E. Horton, Chuxuan Li, Xiang Zhang, Dev Niyogi, Jun Xia, Nengcheng Chen", "abstract": "Urbanization exerts considerable impact on ecological, environmental and meteorological processes and systems. However, the effects of urbanization on local drought remain under-explored. Here we characterize the effects of urbanization on drought across the world’s cities using global weather station observations. We find that drought severity has increased at ~36% of global sites, while the extr...", "doi": "10.1038/s44284-024-00102-z", "year": "2024", "date": "2024-08-07", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00102-z", "tags": ["climate & heat", "health", "economy"]}, {"title": "", "authors": "Steve Frolking, Richa Mahtta, Tom Milliman, Thomas Esch, Karen C. Seto", "abstract": "We present a new study examining the dynamics of global urban building growth rates over the past three decades. By combining datasets for 1,550+ cities from several space-borne sensors—data from three scatterometers and settlement-built fraction based on Landsat-derived data—we find profound shifts in how cities expanded from the 1990s to the 2010s. Cities had both increasing building fractional ...", "doi": "10.1038/s44284-024-00100-1", "year": "2024", "date": "2024-08-05", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00100-1", "tags": ["climate & heat", "health", "economy"]}, {"title": "", "authors": "Iacopo Testi, An Wang, Sanjana Paul, Simone Mora, Erica Walker, Marguerite Nyhan, Fábio Duarte, Paolo Santi, Carlo Ratti", "abstract": "Air pollution disproportionately affects socially disadvantaged populations. Our study bridges the existing gap in quantifying mobility-based exposure and its associated disparity issues. We combined the granular mobility of over 500,000 unique anonymized users daily and hyperlocal air pollution data in 100 × 100-m grid cells to quantify disparities in particulate matter exposure in a racially div...", "doi": "10.1038/s44284-024-00093-x", "year": "2024", "date": "2024-07-29", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00093-x", "tags": ["air quality", "inequality", "planning"]}, {"title": "", "authors": "Miao Yang, Chen Ren, Haorui Wang, Junqi Wang, Zhuangbo Feng, Prashant Kumar, Fariborz Haghighat, Shi-Jie Cao", "abstract": "Globally, the deteriorating Urban Heat Island (UHI) effect poses a significant threat to human health and undermines ecosystem stability. UHI mitigation strategies have been investigated and utilized extensively within cities by the provision of green, blue or gray infrastructures. However, urban land is precious and limited for these interventions, making it challenging to address this issue. Nei...", "doi": "10.1038/s44284-024-00091-z", "year": "2024", "date": "2024-07-05", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00091-z", "tags": ["green & ecology", "climate & heat", "health"]}, {"title": "", "authors": "Chengqi Xia, Heran Zheng, Jing Meng, Yuli Shan, Xi Liang, Jin Li, Zihua Yin, Minggu Chen, Pengfei Du, Can Wang", "abstract": "Outsourced carbon mitigation between cities means that some cities benefit from the carbon mitigation efforts of other cities more than their own. This problem conceals the recognition of cities’ mitigation contributions. Here we quantify local and outsourced carbon mitigation levels from 2012 to 2017 and identified ‘outsourced mitigation beneficiaries’ relying on outsourced efforts more than thei...", "doi": "10.1038/s44284-024-00088-8", "year": "2024", "date": "2024-06-27", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00088-8", "tags": ["air quality", "economy", "energy"]}, {"title": "", "authors": "Andrea Cattaneo, Serkan Girgin, Rolf de By, Theresa McMenomy, Andrew Nelson, Sara Vaz", "abstract": "Urban centers are pivotal in shaping societies, yet a systematic global analysis of how countries are organized around multiple urban centers is lacking. We enhance understanding by delineating city–regions worldwide, classifying over 30,000 urban centers into four tiers—town, small, intermediate and large city—based on population size and mapping their catchment areas based on travel time, differ...", "doi": "10.1038/s44284-024-00083-z", "year": "2024", "date": "2024-06-26", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00083-z", "tags": ["transport", "planning", "economy"]}, {"title": "", "authors": "Ning Zhang, Georg Schiller, Hessam Azarijafari, Zhi Cao, Bin Xi, Yuli Shan, Huanyu Li, Huabo Duan, Jiakuan Yang", "abstract": "The renewal and expansion of the built environment within the context of rapid urbanization are imposing new benchmarks for resource management, particularly concerning the billions of tons of consumption and waste generation of concrete materials. The commercialization of carbonation in cementitious materials is underway, opening up possibilities for nitrogenation that has been well documented in...", "doi": "10.1038/s44284-024-00084-y", "year": "2024", "date": "2024-06-14", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00084-y", "tags": ["air quality", "health", "planning"]}, {"title": "", "authors": "Alby Duarte Rocha, Stenka Vulova, Michael Förster, Beniamino Gioli, Bradley Matthews, Carole Helfter, Fred Meier, Gert-Jan Steeneveld, Janet F. Barlow, Leena Järvi, Nektarios Chrysoulakis, Giacomo Nicolini, Birgit Kleinschmit", "abstract": "Heat stress is the leading climate-related cause of premature deaths in Europe. Major heatwaves have struck Europe recently and are expected to increase in magnitude and length. Large cities are particularly threatened due to the urban morphology and imperviousness. Green spaces mitigate heat, providing cooling services through shade provision and evapotranspiration. However, the distribution of g...", "doi": "10.1038/s44284-024-00077-x", "year": "2024", "date": "2024-05-22", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00077-x", "tags": ["green & ecology", "climate & heat", "health"]}, {"title": "", "authors": "Arianna Salazar-Miranda, Claire Conzelmann, Toàn Phan, Jeremy Hoffman", "abstract": "We investigate the potential long-term impacts of ‘redlining’—the historical practice of assigning values to residential areas in US cities based on race and class—on the vulnerability of communities to climate risks. Using a boundary design methodology for 202 US cities, we document that areas marked by the Home Owners’ Loan Corporation as being less desirable for investment in the 1930s–1940s fa...", "doi": "10.1038/s44284-024-00076-y", "year": "2024", "date": "2024-05-17", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00076-y", "tags": ["green & ecology", "climate & heat", "health"]}, {"title": "", "authors": "Soumya Satyakanta Sethi, V. Vinoj", "abstract": "Cities are vulnerable to the compounding effects of both climate change and urbanization. Here we show that urbanization alone has led to an overall 60% enhancement in warming in Indian cities, with eastern Tier-II cities leading the way. Such a difference in the urban contribution to warming over cities across India calls for a differential approach to combat urban warming effectively. This study...", "doi": "10.1038/s44284-024-00074-0", "year": "2024", "date": "2024-05-15", "type": "Brief Communication", "url": "https://www.nature.com/articles/s44284-024-00074-0", "tags": ["climate & heat", "inequality"]}, {"title": "", "authors": "Shuhong Luo, Jigang Han, Ruirui Chen, Manuel Delgado-Baquerizo, Weiwei Zhang, Youzhi Feng", "abstract": "Animal pathogenic fungi, including human pathogenic fungi, cause millions of deaths annually. We know that these organisms can be found in our urban greenspaces where we enter in contact with them, yet the contribution of socioeconomic development in shaping the distribution of soil-borne animal pathogens from local to global scales remains virtually unknown. Here we used information from a global...", "doi": "10.1038/s44284-024-00073-1", "year": "2024", "date": "2024-05-13", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00073-1", "tags": ["green & ecology", "climate & heat", "health"]}, {"title": "", "authors": "Quirina Rodriguez Mendez, Sabine Fuss, Sarah Lück, Felix Creutzig", "abstract": "Here, with the aim of supporting the path to achieving net-zero emissions in cities, we assess the existing literature on carbon dioxide removal (CDR) at the urban scale, seeking to quantify the potential negative emissions contribution of cities globally. Urban CDR options considered here include the storage of carbon in urban vegetation, soils and buildings, and the capture of CO2 from indoor en...", "doi": "10.1038/s44284-024-00069-x", "year": "2024", "date": "2024-05-02", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00069-x", "tags": ["air quality", "green & ecology", "climate & heat"]}, {"title": "", "authors": "Violeta Berdejo-Espinola, Richard A. Fuller, Renee Zahnow", "abstract": "Access to urban nature is an important contributor to human health. Yet evidence of nature’s benefits comes overwhelmingly from the Global North and might not directly translate to cities in the Global South. Here, using survey data from 1,119 residents of Asunción, Paraguay, we found that the context and intentionality of nature exposure and the function of nature in the individual’s life collect...", "doi": "10.1038/s44284-024-00058-0", "year": "2024", "date": "2024-05-01", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00058-0", "tags": ["green & ecology", "transport", "health"]}, {"title": "", "authors": "Fujie Rao, Haijuan Zhao, Sun Sheng Han, Yijun Kong, Dayi Lai, Tingting Lu", "abstract": "Main streets in city centers are struggling to stay afloat in the post-COVID era, as digital technologies continue to proliferate rapidly in retail. Here we examine the socioeconomic and spatial transformation of Jiang Han Road in Wuhan’s city center, aiming to understand the capacity of city-center main streets for fostering resilience and urban transition after the pandemic. Leveraging adaptive ...", "doi": "10.1038/s44284-024-00063-3", "year": "2024", "date": "2024-04-19", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00063-3", "tags": ["green & ecology", "transport", "disaster"]}, {"title": "", "authors": "Bei Zhu, Chu Wei", "abstract": "City-related mitigation measures are crucial for reducing carbon emissions, but most studies on this issue treat cities as independent entities and neglect their interactions. This is especially relevant in the Chinese context, where peers influence policy decisions. Here we offer a novel perspective about mayors’ strategic interactions to explain cities’ carbon intensity reduction. We use a spati...", "doi": "10.1038/s44284-024-00059-z", "year": "2024", "date": "2024-04-10", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00059-z", "tags": ["air quality", "planning", "energy"]}, {"title": "", "authors": "Zh tags": ["air quality", "green & ecology", "health"]}, {"title": "", "authors": "Indira Adilkhanova, Mat Santamouris, Geun Young Yun", "abstract": "Cities around the globe search for solutions to tackle the challenges of climate resilience and energy consumption. The potential of green roofs representing a nature-based solution in mitigating urban heat and related energy consumption at the urban scale is given limited attention. Here we apply a comprehensive framework integrating urban climate modeling, urban building energy modeling and stat...", "doi": "10.1038/s44284-024-00035-7", "year": "2024", "date": "2024-02-12", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00035-7", "tags": ["green & ecology", "climate & heat", "transport"]}, {"title": "", "authors": "Benjamin Elbers", "abstract": "While overall residential segregation in US cities has declined in the past 30 years—especially between the Black and white populations—relatively little is known about the patterns of population change that caused these changes. Here I investigate changes in racial residential segregation in US cities between 1990 and 2020, and focus on answering two key questions: first, which racial groups are ...", "doi": "10.1038/s44284-024-00032-w", "year": "2024", "date": "2024-02-09", "type": "Article", "url": "https://www.nature.com/articles/s44284-024-00032-w", "tags": ["transport", "inequality", "economy"]}, {"title": "", "authors": "Jason K. Hawes, Benjamin P. Goldstein, Joshua P. Newell, Erica Dorr, Silvio Caputo, Runrid Fox-Kämper, Baptiste Grard, Rositsa T. Ilieva, Agnès Fargue-Lelièvre, Lidia Poniży, Victoria Schoen, Kathrin Specht, Nevin Cohen", "abstract": "Urban agriculture (UA) is a widely proposed strategy to make cities and urban food systems more sustainable. Until now, we have lacked a comprehensive assessment of the environmental performance of UA relative to conventional agriculture, and results from earlier studies have been mixed. This is the first large-scale study to resolve this uncertainty across cities and types of UA, employing citize...", "doi": "10.1038/s44284-023-00023-3", "year": "2024", "date": "2024-01-22", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00023-3", "tags": ["green & ecology", "climate & heat", "health"]}, {"title": "", "authors": "Fritz Kleinschroth, Sini Savilaakso, Ingo Kowarik, Paloma Julia Martinez, Yuyang Chang, Kristen Jakstis, Jessica Schneider, Leonie K. Fischer", "abstract": "The COVID-19 pandemic disrupted urban resilience and challenged the use of urban green space (UGS). Previous studies lack consensus on whether UGS use increased or decreased during and after lockdowns and how this related to policy, economic conditions and UGS types. In a systematic review, we screened &gt;3,000 articles in 5 languages, identifying 177 articles on UGS use changes in 60 countries. ...", "doi": "10.1038/s44284-023-00020-6", "year": "2024", "date": "2024-01-18", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00020-6", "tags": ["green & ecology", "health", "inequality"]}, {"title": "", "authors": "Mingzhen Lu, Chuanbin Zhou, Chenghao Wang, Robert B. Jackson, Christopher P. Kempes", "abstract": "The production of waste as a consequence of human activities is one of the most fundamental challenges facing our society and global ecological systems. Waste generation is rapidly increasing, with corresponding shifts in the structure of our societies, where almost all nations are moving from rural agrarian societies to urban and technological ones. However, the connections between these societal...", "doi": "10.1038/s44284-023-00021-5", "year": "2024", "date": "2024-01-17", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00021-5", "tags": ["air quality", "green & ecology", "health"]}, {"title": "", "authors": "Ying Sun, Hengshu Zhu, Lu Wang, Le Zhang, Hui Xiong", "abstract": "The COVID-19 pandemic has had an unprecedented impac "2024-01-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00008-2", "tags": ["health", "inequality", "planning"]}, {"title": "", "authors": "Morgan R. Frank, Esteban Moro, Tobin South, Alex Rutherford, Alex Pentland, Bledi Taska, Iyad Rahwan", "abstract": "How do skills shape career mobility and access to cities’ labor markets? Here we model career pathways as an occupation network constructed from the similarity of occupations’ skill requirements within each US city. Using a nationally representative survey and three resume datasets, skill similarity predicts transition rates between occupations and predictions improve with increasingly granular sk...", "doi": "10.1038/s44284-023-00009-1", "year": "2024", "date": "2024-01-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00009-1", "tags": ["transport", "economy"]}, {"title": "", "authors": "Uttara Sutradhar, Lauryn Spearing, Sybil Derrible", "abstract": "For cities, having a declining population usually means socioeconomic and infrastructure challenges to accommodate the remaining population. Using population projections, we found that, by 2100, close to half of the nearly 30,000 cities in the United States will face some sort of population decline, representing 12–23% of the population of these 30,000 cities and 27–44% of the populated area. The ...", "doi": "10.1038/s44284-023-00011-7", "year": "2024", "date": "2024-01-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00011-7", "tags": ["climate & heat", "inequality", "planning"]}, {"title": "", "authors": "Cody Cook, Lindsey Currier, Edward Glaeser", "abstract": "Cities provide access to stores, public amenities and other people, but that access may provide less benefit for the lower-income and younger urbanites who lack money and means of easy mobility. Using detailed GPS location data, we measure the urban mobility and experienced racial and economic isolation of the young and the disadvantaged. We find that students in major metropolitan areas experienc...", "doi": "10.1038/s44284-023-00007-3", "year": "2024", "date": "2024-01-11", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00007-3", "tags": ["transport", "inequality", "planning"]}, {"title": "", "authors": "Matei Georgescu, Ashley M. Broadbent, E. Scott Krayenhoff", "abstract": "The continued increase in the duration, frequency and intensity of heat waves is especially problematic in cities, where more than half of the world’s population lives. Here we combine decadal-scale regional climate modeling simulations with projections of urban expansion, greenhouse gas emissions and population migration to examine the extent to which adaptation and mitigation strategies, in isol...", "doi": "10.1038/s44284-023-00001-9", "year": "2023", "date": "2023-12-18", "type": "Article", "url": "https://www.nature.com/articles/s44284-023-00001-9", "tags": ["air quality", "green & ecology", "climate & heat"]}];
var yearsData = {"2023": 1, "2024": 68, "2025": 78, "2026": 26};
var tagsData = {"green & ecology": 74, "health": 72, "planning": 63, "climate & heat": 62, "transport": 55, "inequality": 49, "economy": 36, "air quality": 33, "disaster": 16, "energy": 7, "urban science": 1};

document.getElementById('update-date').textContent = new Date().toISOString().slice(0,10);

// ---- SIDEBAR CHARTS ----
function renderBarChart(containerId, data, maxVal, colorVar) {
  var el = document.getElementById(containerId);
  el.innerHTML = '';
  Object.entries(data).forEach(function([label, count]) {
    var pct = Math.round(count / maxVal * 100);
    el.innerHTML += '<div class="bar-item">' +
      '<div class="bar-label"><span>' + label + '</span><span>' + count + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  });
}

var maxYear = Math.max.apply(null, Object.values(yearsData));
renderBarChart('yearChart', yearsData, maxYear);

var maxTag = Math.max.apply(null, Object.values(tagsData));
renderBarChart('tagChart', tagsData, maxTag);

renderBarChart('typeChart', {'Article': 165, 'Brief Communication': 8}, 165);

// ---- TAG FILTERS ----
var TAGS = Object.keys(tagsData).slice(0, 10);
var activeTag = '';
var tagContainer = document.getElementById('tagFilters');
TAGS.forEach(function(tag) {
  var btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.textContent = tag;
  btn.onclick = function() {
    if (activeTag === tag) {
      activeTag = '';
      btn.classList.remove('active');
    } else {
      document.querySelectorAll('.tag-btn').forEach(function(b) { b.classList.remove('active'); });
      activeTag = tag;
      btn.classList.add('active');
    }
    renderList();
  };
  tagContainer.appendChild(btn);
});

// ---- FILTER & RENDER ----
function getFiltered() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var year = document.getElementById('yearFilter').value;
  var type = document.getElementById('typeFilter').value;
  return papers.filter(function(p) {
    if (year && p.year !== year) return false;
    if (type && p.type !== type) return false;
    if (activeTag && !p.tags.includes(activeTag)) return false;
    if (q) {
      var hay = (p.title + ' ' + p.authors + ' ' + p.abstract).toLowerCase();
      return q.split(' ').every(function(w) { return w === '' || hay.includes(w); });
    }
    return true;
  });
}

function highlight(text, q) {
  if (!q) return text;
  var words = q.trim().split(/\s+/).filter(Boolean);
  var re = new RegExp('(' + words.map(function(w) {
    return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  }).join('|') + ')', 'gi');
  return text.replace(re, '<mark style="background:#b58900;color:#000;border-radius:2px;padding:0 2px">$1</mark>');
}

function renderList() {
  var filtered = getFiltered();
  document.getElementById('resultCount').textContent = filtered.length + ' 篇';
  var container = document.getElementById('paperList');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div>没有匹配的论文</div></div>';
    return;
  }

  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var html = '';
  filtered.forEach(function(p, idx) {
    var typeCls = p.type === 'Article' ? 'type-article' : 'type-brief';
    var tagsHtml = p.tags.map(function(t) {
      return '<span class="paper-tag">' + t + '</span>';
    }).join('');
    var authShort = p.authors.length > 80 ? p.authors.slice(0,80) + '…' : p.authors;
    var titleHtml = highlight(p.title, q);
    var abstractHtml = highlight(p.abstract, q);
    var doiShort = p.doi ? p.doi.replace('10.1038/','') : '';

    html += '<div class="paper-card">' +
      '<div class="paper-header">' +
        '<div class="paper-meta-left">' +
          '<span class="paper-type-badge ' + typeCls + '">' + p.type + '</span>' +
          '<div class="paper-title"><a href="' + p.url + '" target="_blank">' + titleHtml + '</a></div>' +
          '<div class="paper-date">' + p.date + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="paper-authors">' + authShort + '</div>' +
      '<div class="paper-abstract collapsed" id="abs-' + idx + '">' + abstractHtml + '</div>' +
      '<div class="paper-footer">' +
        tagsHtml +
        '<button class="expand-btn" onclick="toggleAbs(' + idx + ',this)">展开</button>' +
        (doiShort ? '<span class="paper-doi">' + doiShort + '</span>' : '') +
      '</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

function toggleAbs(idx, btn) {
  var el = document.getElementById('abs-' + idx);
  if (el.classList.contains('collapsed')) {
    el.classList.remove('collapsed');
    btn.textContent = '收起';
  } else {
    el.classList.add('collapsed');
    btn.textContent = '展开';
  }
}

// debounce search
var timer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(timer);
  timer = setTimeout(renderList, 200);
});
document.getElementById('yearFilter').addEventListener('change', renderList);
document.getElementById('typeFilter').addEventListener('change', renderList);

renderList();
</script>
