<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的报告中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f13;
      color: #e2e8f0;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 24px 20px 20px;
      border-bottom: 1px solid #2d2d3d;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #fff; }
    header p { font-size: 12px; color: #64748b; margin-top: 4px; }
    #update-time { font-size: 11px; color: #475569; margin-top: 2px; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 13px; font-weight: 600; color: #64748b;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 10px; padding-left: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: #1e293b; }

    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d3d;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-link {
      display: flex; align-items: center; gap: 10px;
      flex: 1; min-width: 0;
      text-decoration: none; color: inherit;
    }
    .card-link:active { opacity: 0.7; }
    .card-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .icon-finance { background: rgba(16,185,129,0.15); }
    .icon-research { background: rgba(99,102,241,0.15); }
    .icon-ai { background: rgba(245,158,11,0.15); }
    .card-info { flex: 1; min-width: 0; }
    .card-title {
      font-size: 14px; font-weight: 500; color: #e2e8f0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-meta { font-size: 11px; color: #475569; margin-top: 3px; }

    .card-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-share {
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      color: #818cf8;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-share:active { background: rgba(99,102,241,0.3); transform: scale(0.95); }
    .btn-share.copied {
      background: rgba(16,185,129,0.15);
      border-color: rgba(16,185,129,0.3);
      color: #10b981;
    }
    .card-arrow { color: #334155; font-size: 16px; }

    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 20px;
      font-size: 10px; font-weight: 600; margin-left: 6px;
    }
    .badge-new { background: rgba(16,185,129,0.2); color: #10b981; }

    .empty { text-align: center; color: #334155; font-size: 13px; padding: 20px; }

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none; z-index: 999; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    footer {
      text-align: center; color: #334155; font-size: 11px;
      padding: 20px; border-top: 1px solid #1e293b; margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <h1>&#128202; 我的报告中心</h1>
  <p>点卡片查看 · 点分享获取独立链接</p>
  <div id="update-time"></div>
</header>

<div class="container">

  <!-- 研究报告 -->
  <div class="section">
    <div class="section-title">&#128300; 研究报告</div>

    <div class="card">
      <a class="card-link" href="urban_biodiversity_infographic.html">
        <div class="card-icon icon-research">&#127807;</div>
        <div class="card-info">
          <div class="card-title">城市生物多样性信息图<span class="badge badge-new">NEW</span></div>
          <div class="card-meta">2026年3月</div>
        </div>
        <div class="card-arrow">&#8250;</div>
      </a>
      <div class="card-actions">
        <button class="btn-share" onclick="shareReport('urban_biodiversity_infographic.html', this)">&#128279; 分享</button>
      </div>
    </div>

  </div>

  <!-- 财经分析 -->
  <div class="section">
    <div class="section-title">&#128185; 财经分析</div>
    <div class="empty">财经报告将在此显示</div>
  </div>

  <!-- AI 动态 -->
  <div class="section">
    <div class="section-title">&#129302; AI 动态</div>
    <div class="empty">AI 日报将在此显示</div>
  </div>

</div>

<div id="toast">&#10003; 链接已复制</div>

<footer>自动同步 · 由 WorkBuddy 生成</footer>

<script>
  document.getElementById('update-time').textContent =
    '最后更新：' + new Date().toLocaleDateString('zh-CN') + ' ' +
    new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});

  function shareReport(filename, btn) {
    const base = location.origin + location.pathname.replace(/\/[^\/]*$/, '');
    const url = base + '/' + filename;
    if (navigator.share) {
      navigator.share({ title: document.title, url: url });
      return;
    }
    navigator.clipboard.writeText(url).then(function() {
      btn.classList.add('copied');
      btn.textContent = '已复制';
      setTimeout(function() {
        btn.classList.remove('copied');
        btn.textContent = '分享';
      }, 2000);
      var toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2000);
    });
  }
</script>

</body>
</html>
